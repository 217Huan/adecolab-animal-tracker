<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Japanese Study · AdecoLab</title>
  <link rel="stylesheet" href="japanese/style.css">
  <script defer src="japanese/vocabulary.js"></script><script defer src="japanese/core.js"></script>
  <script defer src="japanese/i18n.js"></script><script defer src="japanese/favorites.js"></script>
  <script defer src="japanese/config.js"></script><script defer src="japanese/listening-extra.js"></script><script defer src="japanese/app.js"></script>
</head>
<body>
  <header><a class="brand" href="index.html">AdecoLab <span>/ 日本語</span></a><div class="header-actions"><a href="index.html" data-text="tracker">Animal tracker & heatmap ↗</a><button id="study-theme" type="button"></button><button id="language" type="button">中文</button></div></header>
  <main>
    <section class="intro"><p class="eyebrow">GENKI I · THIRD EDITION · LESSONS 01–08</p><h1><span class="headline" data-text="headline">A few more words, every day.</span><span lang="ja">ことばを、ひとつずつ。</span></h1><p data-text="intro"></p></section>
    <div class="layout">
      <aside class="panel library"><h2 data-text="folders"></h2><nav id="folders"></nav><button id="listening-tab" class="listening-tab" type="button" aria-pressed="false" data-text="listeningTitle"></button><p class="aside-note" data-text="folderHelp"></p>
        <details class="account-panel"><summary data-text="account"></summary><p id="account-status" class="muted" aria-live="polite"></p><p id="account-availability" class="muted"></p>
          <form id="account-form" hidden><label for="email" data-text="email"></label><input id="email" type="email" required autocomplete="username" maxlength="254"><label for="password" data-text="password"></label><input id="password" type="password" required minlength="8" autocomplete="current-password" maxlength="128"><div class="auth-actions"><button id="login" type="submit" class="primary" data-text="login"></button><button id="signup" type="button" data-text="signup"></button><button id="forgot" type="button" data-text="forgot"></button><button id="update-password" type="button" hidden data-text="updatePassword"></button></div></form>
          <button id="logout" hidden data-text="logout"></button><button id="retry-sync" hidden data-text="retry"></button><p id="account-message" role="status" class="muted"></p><p class="muted" data-text="accountHelp"></p>
        </details>
      </aside>
      <div class="workspace">
        <section id="listening-panel" class="panel listening-panel" hidden>
          <p class="eyebrow">IRODORI · STARTER A1</p><h2 data-text="listeningTitle"></h2><p class="muted" data-text="listeningIntro"></p>
          <div class="filter-row"><label><span data-text="listeningClip"></span><select id="listening-clip"></select></label><label><span data-text="listeningSpeed"></span><select id="listening-speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label></div>
          <div class="listening-player"><h3 id="listening-name"></h3><audio id="listening-audio" controls preload="none"></audio><p id="listening-error" role="status" class="muted" hidden data-text="listeningError"></p><button id="listening-replay" type="button" data-text="listeningReplay"></button></div>
          <label class="favorite-filter"><input id="listening-subtitles" type="checkbox"><span data-text="listeningSubtitles"></span></label>
          <div id="listening-transcript" class="listening-transcript" hidden><p id="listening-ja" lang="ja"></p><p id="listening-translation" class="muted"></p></div>
          <p class="muted" data-text="listeningTip"></p><p class="muted">© The Japan Foundation Japanese-Language Institute, Urawa · <a id="listening-source" href="https://www.irodori.jpf.go.jp/starter/audio/lesson03.html" target="_blank" rel="noopener" data-text="listeningSource"></a> · <a href="https://www.irodori.jpf.go.jp/en/privacy.html" target="_blank" rel="noopener" data-text="listeningTerms"></a> · <a id="listening-script-source" href="https://www.irodori.jpf.go.jp/assets/data/starter/pdf/X_L03.pdf" target="_blank" rel="noopener" data-text="listeningScriptSource"></a></p>
        </section>
        <section class="panel filters">
          <div class="setup-bar"><label class="mode-picker"><span data-text="mode"></span><select id="mode"><option value="cards" data-text="cards"></option><option value="spelling" data-text="spelling"></option><option value="te" data-text="teMode"></option><option value="verbType" data-text="verbTypeMode"></option></select></label><span id="count" class="muted"></span><button id="start" class="primary" data-text="start"></button></div>
          <div class="selection-bar"><label class="favorite-filter"><input id="only-favorites" type="checkbox"><span data-text="onlyFavorites"></span><span id="favorite-count" class="badge"></span></label>
          <details class="practice-settings" open><summary data-text="settings"></summary><div class="settings-content"><div class="filter-row"><label><span data-text="pos"></span><select id="pos"><option value="all" data-text="allTypes"></option><option value="noun" data-text="noun"></option><option value="verb" data-text="verb"></option><option value="adjective" data-text="adjective"></option><option value="other" data-text="other"></option></select></label><label><span data-text="subtype"></span><select id="subtype"></select></label><label id="direction-wrap"><span data-text="front"></span><select id="direction"><option value="english" data-text="english"></option><option value="japanese" data-text="japanese"></option></select></label><label><span data-text="order"></span><select id="order"><option value="random" data-text="randomOrder"></option><option value="list" data-text="listOrder"></option></select></label></div><p class="muted" data-text="favoriteHelp"></p></div></details></div>
          <div class="custom-builder"><div class="custom-toolbar"><button id="add-group" type="button" data-text="addGroup"></button><label class="favorite-filter"><input id="use-groups" type="checkbox"><span data-text="useGroups"></span></label></div><p class="muted" data-text="groupHelp"></p><div id="custom-groups" class="custom-groups"></div></div><p id="settings-note" class="muted" aria-live="polite"></p><p id="favorite-message" class="muted" role="status"></p>
        </section>
        <section class="panel study">
          <div class="study-heading"><h2 id="deck-title"></h2><span id="round" class="badge"></span></div>
          <div class="progress-label"><span id="position"></span><span id="mastery"></span></div><progress id="progress" value="0" max="1"></progress>
          <div id="welcome" class="welcome"><span lang="ja">はじめましょう</span><h3 data-text="welcomeTitle"></h3><p data-text="welcomeText"></p></div>
          <div id="exercise" hidden>
            <div class="word-toolbar"><p id="word-meta" class="muted"></p><button id="favorite-word" type="button" aria-pressed="false"></button></div>
            <div id="card-stage" class="card-stage"><button id="flashcard" class="flashcard" type="button" aria-pressed="false"><span class="card-inner"><span class="card-face card-front"><span id="card-label" class="eyebrow"></span><strong id="card-main"></strong><span id="card-reading" class="card-reading" lang="en"></span><span class="flip-hint" data-text="flip"></span></span><span class="card-face card-back" aria-hidden="true"><span id="card-back-label" class="eyebrow"></span><strong id="card-back-main"></strong><span id="card-back-reading" class="card-reading" lang="en"></span><span class="flip-hint" data-text="flip"></span></span></span></button></div>
            <div id="card-navigation" class="card-navigation"><button id="previous-card" type="button" data-label="previousCard">←</button><p data-text="browseHint"></p><button id="next-card" type="button" data-label="nextCard">→</button></div>
            <div id="card-actions" class="actions"><button id="unknown" data-text="unknown"></button><button id="known" class="primary" data-text="known"></button></div>
            <div id="spelling" hidden>
              <div class="spelling-prompt"><p class="eyebrow" id="prompt-label"></p><strong id="spelling-word"></strong><p id="spelling-meaning"></p><button id="hide-word" type="button"></button><div id="answer-preview" hidden aria-hidden="true"><p id="preview-label" class="eyebrow"></p><strong id="preview-text" lang="ja"></strong></div></div>
              <div id="verb-choices" class="actions" hidden><button type="button" data-verb="る动词">る verb</button><button type="button" data-verb="う动词">う verb</button><button type="button" data-verb="不规则动词">Irregular</button></div><form id="answer-form"><label for="answer" data-text="answer"></label><div class="answer-row"><input id="answer" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="check" class="primary" type="submit" data-text="check"></button></div></form>
              <p class="muted input-note" data-text="inputHelp"></p><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" hidden data-text="next"></button>
            </div>
          </div>
          <div id="complete" class="welcome" hidden><span lang="ja">よくできました！</span><h3 data-text="completeTitle"></h3><p id="complete-text"></p><button id="again" class="primary" data-text="again"></button></div>
          <p id="empty" class="welcome" hidden data-text="empty"></p>
        </section>
        <details class="panel"><summary><span data-text="list"></span> <span id="list-count"></span></summary><div class="table-scroll"><table><thead><tr><th id="lesson-header"></th><th data-text="japanese"></th><th data-text="reading"></th><th>English</th><th data-text="pos"></th><th data-text="favorites"></th></tr></thead><tbody id="word-list"></tbody></table></div></details>
      </div>
    </div>
    <footer data-text="scope"></footer>
  </main>
  <noscript>Enable JavaScript to use Japanese study. / 请启用 JavaScript。</noscript>
</body>
</html>
